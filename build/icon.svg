  <g fill="#f2c36b">
    <circle cx="730.0" cy="540.0" r="24"/><circle cx="666.1" cy="694.1" r="24"/><circle cx="512.0" cy="758.0" r="24"/><circle cx="357.9" cy="694.1" r="24"/><circle cx="294.0" cy="540.0" r="24"/><circle cx="357.9" cy="385.9" r="24"/><circle cx="512.0" cy="322.0" r="24"/><circle cx="666.1" cy="385.9" r="24"/>
