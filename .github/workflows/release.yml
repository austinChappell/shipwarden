# Builds ShipWarden for macOS and publishes a GitHub release with release notes.
# Run it from GitHub › Actions › Release, or: gh workflow run release.yml -f bump=patch
#
# Code signing (optional): add the secrets MAC_CERTIFICATE_P12 (the certificate and its private key, as base64)
# and MAC_CERTIFICATE_PASSWORD. Without them, the build has an ad-hoc signature.
# Notarization (optional): add the secrets APPLE_API_KEY_P8 (the App Store Connect API key, as base64),
# APPLE_API_KEY_ID and APPLE_API_ISSUER. Notarization needs the signing secrets too. See docs/RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Electron download comes from GitHub Releases, which sometimes answers with 504. With the cache, most runs
      # do not download it. A failed run also saves the cache (see the last step).
      # Only the Electron cache is kept: @electron/get checks the SHA-256 of a cached file each time that it uses it.
      # electron-builder reuses an extracted tool folder from its cache without a hash check, so its tools
      # (7zip, dmgbuild) are downloaded and checked again in each run.
      - name: Restore the Electron download
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/electron
          # Each run saves under its own key. The restore takes the newest cache, first for the same package-lock.json.
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Set the new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # The base is the newest release tag (or package.json, when it is higher).
          VERSION=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/next-version.mjs "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Write the release notes
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release-notes.mjs "${{ steps.version.outputs.version }}" release-notes.md

      - name: Build the app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-vite build
          BUILDER_ARGS=(--mac --publish never)
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate. The build has an ad-hoc signature."
            unset CSC_LINK CSC_KEY_PASSWORD
            BUILDER_ARGS+=(-c.mac.identity=null)
          fi
          # electron-builder notarizes the app when APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set.
          # APPLE_API_KEY is the path of the .p8 file.
          NOTARIZE=false
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            NOTARIZE=true
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            (umask 077 && printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY")
          else
            echo "::warning::No notarization key or no signing certificate. The build is not notarized."
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_P8
          # electron-builder downloads its tools (7zip, dmgbuild) from GitHub Releases, which sometimes answers with 504.
          # Retry only the observed HTTP 504 download failure. Attempts 3 and 4 use a mirror.
          # All other failures, including checksum mismatches, stop the release immediately.
          # electron-builder checks each tool against a SHA-256 in its code.
          for ATTEMPT in 1 2 3 4; do
            if [ "$ATTEMPT" -ge 3 ]; then
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
              echo "::warning::electron-builder uses the mirror $ELECTRON_BUILDER_BINARIES_MIRROR."
            fi
            BUILD_LOG="$RUNNER_TEMP/electron-builder-attempt-${ATTEMPT}.log"
            if npx electron-builder "${BUILDER_ARGS[@]}" 2>&1 | tee "$BUILD_LOG"; then
              break
            fi
            if grep -Eiq 'checksum mismatch|integrity check failed' "$BUILD_LOG"; then
              echo "::error::electron-builder reported an integrity failure. Refusing to retry."
              exit 1
            fi
            if ! grep -Fq 'Response code 504 (Gateway Time-out)' "$BUILD_LOG"; then
              echo "::error::electron-builder failed without an HTTP 504. Refusing to retry."
              exit 1
            fi
            if [ "$ATTEMPT" -eq 4 ]; then
              echo "::error::electron-builder failed with HTTP 504 four times."
              exit 1
            fi
            WAIT=$((10 * 2 ** (ATTEMPT - 1)))
            echo "::warning::electron-builder failed (attempt $ATTEMPT of 4). The next attempt starts in $WAIT seconds."
            sleep "$WAIT"
          done
          if [ "$NOTARIZE" = true ]; then
            # Stop the release if the app does not have a stapled notarization ticket.
            xcrun stapler validate dist/mac-arm64/ShipWarden.app
            spctl --assess --type execute --verbose=4 dist/mac-arm64/ShipWarden.app
          fi

      - name: Write the update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP=$(ls dist/*-"$VERSION"-arm64-mac.zip)
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/update-manifest.mjs "$VERSION" "$ZIP" dist/shipwarden-update.json

      # The release commit has the new version in package.json. Only its tag goes to GitHub. The workflow does not push
      # to the branch, so a push to the branch during the build cannot stop the release.
      - name: Tag the version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            --title "ShipWarden $VERSION" \
            --notes-file release-notes.md \
            dist/*-"$VERSION"-arm64.dmg \
            dist/*-"$VERSION"-arm64-mac.zip \
            dist/shipwarden-update.json

      - name: Save the Electron download
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
